<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #6ea8fe;
    --text: #e8e8e8;
    --muted: #9aa0a6;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem;
  }
  h1 { margin-top: 0; font-size: 1.6rem; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .total {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .cat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0.5rem 0;
  }
  .bar-bg {
    background: #2a2d35;
    border-radius: 6px;
    height: 8px;
    flex: 1;
    margin: 0 0.75rem;
    overflow: hidden;
  }
  .bar-fill {
    background: var(--accent);
    height: 100%;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  input, select, button {
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #333;
    background: #12141a;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  button.secondary {
    background: #2a2d35;
    color: var(--text);
    margin-top: 0.5rem;
  }
  button.danger {
    background: var(--danger);
    color: #1a0000;
  }
  button.small {
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
    margin-right: 0.3rem;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.3rem; border-bottom: 1px solid #2a2d35; font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .full { grid-column: 1 / -1; }
  #status { min-height: 1.2rem; font-size: 0.85rem; color: var(--muted); }
  .filters {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .filters select, .filters input { flex: 1; min-width: 140px; }
  canvas { width: 100%; max-height: 220px; }
</style>
</head>
<body>

<h1>💰 Expense Tracker Dashboard</h1>
<p class="muted">Connected to your Spring Boot API at <code id="apiUrlDisplay"></code></p>

<div class="grid">

  <div class="card">
    <div class="muted">Total Spend</div>
    <div class="total" id="totalSpend">—</div>
    <div class="muted" id="topCategory"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom: 0.5rem;">Spend by Category</div>
    <div id="categoryList"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom: 0.5rem;" id="formTitle">Add Expense</div>
    <form id="addForm">
      <input type="number" id="amount" placeholder="Amount" step="0.01" required>
      <input type="text" id="description" placeholder="Description (e.g. Uber ride)" required>
      <button type="submit" id="submitBtn">Add Expense</button>
      <button type="button" class="secondary" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
    </form>
    <button class="secondary" id="loadSampleBtn">Load Sample Data</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom: 0.5rem;">Monthly Trend</div>
    <canvas id="trendChart" width="400" height="220"></canvas>
  </div>

  <div class="card full">
    <div class="muted" style="margin-bottom: 0.5rem;">All Expenses</div>
    <div class="filters">
      <select id="categoryFilter"><option value="">All Categories</option></select>
      <input type="date" id="fromDate">
      <input type="date" id="toDate">
      <button type="button" class="secondary" id="clearFilterBtn">Clear Filters</button>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right;">Amount</th><th></th></tr></thead>
      <tbody id="expenseTableBody"></tbody>
    </table>
  </div>

</div>

<script>
  const API_URL = "http://localhost:8080/expenses";
  document.getElementById("apiUrlDisplay").textContent = API_URL;

  let allExpenses = [];
  let editingId = null;

  async function loadSummary() {
    try {
      const res = await fetch(API_URL + "/summary");
      const data = await res.json();

      document.getElementById("totalSpend").textContent = "₹" + data.totalSpend.toFixed(2);
      document.getElementById("topCategory").textContent =
        data.topCategory ? "Top category: " + data.topCategory : "";

      const catList = document.getElementById("categoryList");
      catList.innerHTML = "";
      const entries = Object.entries(data.byCategory || {}).sort((a, b) => b[1] - a[1]);
      const max = entries.length ? entries[0][1] : 1;

      entries.forEach(([cat, amt]) => {
        const row = document.createElement("div");
        row.className = "cat-row";
        row.innerHTML = `
          <span style="width:110px;">${cat}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(amt / max) * 100}%"></div></div>
          <span>₹${amt.toFixed(2)}</span>
        `;
        catList.appendChild(row);
      });
    } catch (err) {
      setStatus("Could not reach the API. Is your Spring Boot app running?", true);
    }
  }

  async function loadMonthlyTrend() {
    try {
      const res = await fetch(API_URL + "/monthly");
      const data = await res.json();
      drawTrendChart(data);
    } catch (err) {
      // silently skip if not available
    }
  }

  function drawTrendChart(data) {
    const canvas = document.getElementById("trendChart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const entries = Object.entries(data).sort((a, b) => a[0].localeCompare(b[0]));
    if (entries.length === 0) return;

    const max = Math.max(...entries.map(e => e[1]));
    const barWidth = canvas.width / entries.length;
    const chartHeight = canvas.height - 30;

    ctx.fillStyle = "#6ea8fe";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";

    entries.forEach(([month, amt], i) => {
      const barHeight = (amt / max) * (chartHeight - 10);
      const x = i * barWidth + barWidth * 0.15;
      const y = chartHeight - barHeight;
      ctx.fillStyle = "#6ea8fe";
      ctx.fillRect(x, y, barWidth * 0.7, barHeight);
      ctx.fillStyle = "#9aa0a6";
      ctx.fillText(month.slice(5), x + (barWidth * 0.35), chartHeight + 15);
    });
  }

  function populateCategoryFilter() {
    const select = document.getElementById("categoryFilter");
    const current = select.value;
    const categories = [...new Set(allExpenses.map(e => e.category))].sort();
    select.innerHTML = '<option value="">All Categories</option>' +
      categories.map(c => `<option value="${c}">${c}</option>`).join("");
    select.value = current;
  }

  function renderTable() {
    const catFilter = document.getElementById("categoryFilter").value;
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;

    let filtered = allExpenses.filter(exp => {
      if (catFilter && exp.category !== catFilter) return false;
      if (from && exp.expenseDate < from) return false;
      if (to && exp.expenseDate > to) return false;
      return true;
    });

    filtered.sort((a, b) => new Date(b.expenseDate) - new Date(a.expenseDate));

    const tbody = document.getElementById("expenseTableBody");
    tbody.innerHTML = "";
    filtered.forEach(exp => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${exp.expenseDate}</td>
        <td>${exp.description}</td>
        <td>${exp.category}</td>
        <td style="text-align:right;">₹${exp.amount.toFixed(2)}</td>
        <td>
          <button class="small secondary" onclick="startEdit(${exp.id})">Edit</button>
          <button class="small danger" onclick="deleteExpense(${exp.id})">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function loadExpenses() {
    try {
      const res = await fetch(API_URL);
      allExpenses = await res.json();
      populateCategoryFilter();
      renderTable();
    } catch (err) {
      setStatus("Could not reach the API. Is your Spring Boot app running?", true);
    }
  }

  function setStatus(msg, isError) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.style.color = isError ? "#ff8080" : "#9aa0a6";
  }

  async function refreshAll() {
    await loadSummary();
    await loadExpenses();
    await loadMonthlyTrend();
  }

  window.startEdit = function (id) {
    const exp = allExpenses.find(e => e.id === id);
    if (!exp) return;
    editingId = id;
    document.getElementById("amount").value = exp.amount;
    document.getElementById("description").value = exp.description;
    document.getElementById("formTitle").textContent = "Edit Expense";
    document.getElementById("submitBtn").textContent = "Update Expense";
    document.getElementById("cancelEditBtn").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.deleteExpense = async function (id) {
    if (!confirm("Delete this expense?")) return;
    setStatus("Deleting...");
    try {
      await fetch(API_URL + "/" + id, { method: "DELETE" });
      setStatus("Deleted.");
      await refreshAll();
    } catch (err) {
      setStatus("Failed to delete.", true);
    }
  };

  document.getElementById("cancelEditBtn").addEventListener("click", () => {
    resetForm();
  });

  function resetForm() {
    editingId = null;
    document.getElementById("addForm").reset();
    document.getElementById("formTitle").textContent = "Add Expense";
    document.getElementById("submitBtn").textContent = "Add Expense";
    document.getElementById("cancelEditBtn").style.display = "none";
  }

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const amount = document.getElementById("amount").value;
    const description = document.getElementById("description").value;

    setStatus(editingId ? "Updating..." : "Adding...");
    try {
      const url = editingId ? API_URL + "/" + editingId : API_URL;
      const method = editingId ? "PUT" : "POST";

      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount, description })
      });
      if (!res.ok) throw new Error("Request failed");

      setStatus(editingId ? "Updated!" : "Added!");
      resetForm();
      await refreshAll();
    } catch (err) {
      setStatus("Request failed. Check the API is running.", true);
    }
  });

  document.getElementById("loadSampleBtn").addEventListener("click", async () => {
    setStatus("Loading sample data...");
    try {
      await fetch(API_URL + "/sample", { method: "POST" });
      setStatus("Sample data loaded!");
      await refreshAll();
    } catch (err) {
      setStatus("Failed to load sample data.", true);
    }
  });

  document.getElementById("categoryFilter").addEventListener("change", renderTable);
  document.getElementById("fromDate").addEventListener("change", renderTable);
  document.getElementById("toDate").addEventListener("change", renderTable);
  document.getElementById("clearFilterBtn").addEventListener("click", () => {
    document.getElementById("categoryFilter").value = "";
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";
    renderTable();
  });

  refreshAll();
</script>

</body>
</html>
